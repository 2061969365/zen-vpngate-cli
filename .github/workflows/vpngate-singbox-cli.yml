name: vpngate-singbox-cli

# 全量 VPNGate 节点（--limit 0）→ sing-box openvpn-client，每节点独立 mixed 端口，
# 8 并发 worker 跑官方 CLI，统计 200 / 429 / 隧道失败。
on:
  workflow_dispatch:
    inputs:
      workers:
        description: concurrent nodes per shard
        default: "8"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: egress ip (runner)
        run: |
          curl -s -m 20 http://ip-api.com/json | python3 -c 'import json,sys; j=json.load(sys.stdin); print("SHARD=${{ matrix.shard }} RUNNER_IP=", j.get("query"), j.get("countryCode",""), j.get("as",""))'

      - name: install sing-box
        run: |
          set -e
          V=$(curl -s -m 30 https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          echo "SINGBOX_VERSION=$V"
          curl -sL -m 180 -o /tmp/sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz"
          tar xzf /tmp/sb.tgz -C /tmp
          sudo install -m755 "/tmp/sing-box-${V}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version | head -2

      - name: install official cli
        run: |
          set -u
          npm install -g @opencode/cli@latest >/tmp/npm.log 2>&1 || { echo "CLI_INSTALL_FAIL"; tail -10 /tmp/npm.log; exit 0; }
          echo "CLI_VERSION=$(opencode --version 2>&1 | head -1)"

      - name: fetch vpngate snapshot + convert all
        run: |
          set -e
          curl -s -m 120 -o /tmp/vg.csv "https://www.vpngate.net/api/iphone/" || true
          echo "CSV_BYTES=$(wc -c </tmp/vg.csv) LINES=$(wc -l </tmp/vg.csv)"
          git clone --depth 1 https://github.com/2061969365/railway-vpngate-combined.git /tmp/conv >/dev/null 2>&1
          cd /tmp
          python3 conv/vpngate_to_singbox.py --csv vg.csv --output sb.json --limit 0 --tag vpn --no-probe
          python3 -c "import json;e=json.load(open('/tmp/sb.json'))['endpoints'];print('TOTAL_ENDPOINTS',len(e))"

      - name: run cli on all assigned nodes (parallel)
        env:
          WORKERS: ${{ inputs.workers }}
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: "6"
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          python3 tests/run_nodes.py 2>&1 | tee /tmp/run.log
          echo "=== summary ==="
          grep -c '"verdict": "OK200"' /tmp/run.log || true

      - name: results table
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("/tmp/results_${{ matrix.shard }}.json")
          print(f"### shard ${{ matrix.shard }}")
          if not p.exists():
              print("no results"); raise SystemExit
          rows = json.loads(p.read_text(encoding="utf-8"))
          ok = [r for r in rows if r["verdict"] == "OK200"]
          print(f"- nodes: {len(rows)}, OK200: {len(ok)}")
          print("| node | exit ip | ipify | verdict |")
          print("|---|---|---|---|")
          for r in sorted(rows, key=lambda x: (x["verdict"] != "OK200", x.get("tag", ""))):
              print(f"| {r.get('tag','')} {r.get('server','')} | {r.get('exit_ip','')} | {r.get('ipify','')} | {r['verdict']} |")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-shard-${{ matrix.shard }}
          path: /tmp/results_${{ matrix.shard }}.json
          if-no-files-found: ignore
